{{define "groceries/overview_page"}}
<main>
    <form hx-post="/groceries/lists" hx-target="main" hx-swap="outerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset();" class="add-list">
        <label for="add-list" class="sr-only">List Name</label>
        <input autocomplete="off" type="text" id="add-list" name="name" class="glass-inner"
            placeholder="New grocery list...">
        <button class="block" type="submit">
            <span>Add list</span>
            <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
        </button>
    </form>

    <div id="modal-root"></div>

    <section id="grocery-lists" aria-labelledby="grocery-lists-title">
        <h2 id="grocery-lists-title">Grocery Lists</h2>

        {{range .Lists}}
        <article
            class="grocery-list-card card glass flex space-between {{if eq .GroceryListStats.Total 0}}darken{{end}}"
            data-list-id="{{.GroceryList.ID}}" data-list-name="{{.GroceryList.Name}}">

            <div>
                <h3>{{.GroceryList.Name}}</h3>
                {{if gt .GroceryListStats.Total 0}}
                <small class="badge check">{{.GroceryListStats.Total}} Item{{if gt .GroceryListStats.Total
                    1}}s{{end}}</small>
                {{else}}
                <small class="badge">Empty - open to add items</small>
                {{end}}
            </div>

            <div class="flex align-items gap-6px">
                <form hx-get="/groceries/lists/{{.GroceryList.ID}}" hx-swap="outerHTML" hx-target="main">
                    <button type="submit">Open</button>
                </form>
                <button type="button" hx-get="/groceries/lists/{{.GroceryList.ID}}/edit" hx-target="#modal-root"
                    hx-swap="innerHTML" class="edit-grocery-list-btn">Edit</button>
            </div>
        </article>
        {{end}}
    </section>
</main>
{{end}}
