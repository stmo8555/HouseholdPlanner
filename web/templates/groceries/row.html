{{define "groceries/row"}}
<div data-id="{{.ID}}" class="grocery-row changable">
    <form hx-post="/groceries" hx-target=".grocery-list" hx-swap="outerHTML" hx-include="#grocery-list-state">
        <input type="hidden" name="id" value="{{.ID}}">
        <button type="submit">
            <div class="checkbox {{if .Picked}}checked{{end}}"></div>
            <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
        </button>
    </form>

    <span class="{{if .Picked}}line-through{{end}}" data-field="name">{{.Ingredient.Product.Name}}</span>
    <span class="{{if .Picked}}line-through{{end}}" data-field="amount">{{.Ingredient.Amount}}</span>
    <span class="{{if .Picked}}line-through{{end}}" data-field="brand">{{.Ingredient.Product.Brand}}</span>
    <button class="edit-btn" type="button">⋮</button>
</div>
{{end}}
