{{define "edit-grocery-list"}}
<dialog class="glass card" id="edit-grocery-list-modal" hx-on::after-request="if(event.detail.successful) { this.remove(); }">
    <form class="flex align-items" method="dialog" onsubmit="this.closest('dialog').remove()">
        <h2>Edit list - <span id="edit-modal-title">{{.List.GroceryList.Name}}</span></h2>
        <button class="close-button" type="submit">
            <svg fill="#FFFFFF" height="1rem" width="1rem" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 460.775 460.775" xml:space="preserve">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <path
                        d="M285.08,230.397L456.218,59.27c6.076-6.077,6.076-15.911,0-21.986L423.511,4.565c-2.913-2.911-6.866-4.55-10.992-4.55 c-4.127,0-8.08,1.639-10.993,4.55l-171.138,171.14L59.25,4.565c-2.913-2.911-6.866-4.55-10.993-4.55 c-4.126,0-8.08,1.639-10.992,4.55L4.558,37.284c-6.077,6.075-6.077,15.909,0,21.986l171.138,171.128L4.575,401.505 c-6.074,6.077-6.074,15.911,0,21.986l32.709,32.719c2.911,2.911,6.865,4.55,10.992,4.55c4.127,0,8.08-1.639,10.994-4.55 l171.117-171.12l171.118,171.12c2.913,2.911,6.866,4.55,10.993,4.55c4.128,0,8.081-1.639,10.992-4.55l32.709-32.719 c6.074-6.075,6.074-15.909,0-21.986L285.08,230.397z">
                    </path>
                </g>
            </svg>
        </button>
    </form>

    <form id="list-rename-form" hx-patch="/groceries/lists/{{.List.GroceryList.ID}}" hx-target="main"
        hx-swap="outerHTML" class="modal-form">
        <h3>Rename list</h3>
        <small>Change the name of this list.</small>
        <label class="sr-only" for="edit-name">List name</label>
        <input type="text" class="glass-inner" id="edit-name" name="new-name" value="{{.List.GroceryList.Name}}" required>
        <button class="" type="submit">
            <span>Save</span>
            <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
        </button>
    </form>

    <form id="list-transfer-form" hx-post="/groceries/lists/{{.List.GroceryList.ID}}/transfer" hx-target="main"
        hx-swap="outerHTML" class="modal-form{{if le (len .Lists) 1}} darken{{end}}">
        <h3>Transfer groceries</h3>
        <small>Move all groceries in this list to another list.</small>
        <select id="transfer-list-select" name="grocery-list-target-id" class="flex" {{if le (len .Lists) 1}}disabled{{end}}>
            {{range .Lists}}
            {{if ne .GroceryList.ID $.List.GroceryList.ID}}
            <option value="{{.GroceryList.ID}}">{{.GroceryList.Name}}</option>
            {{end}}
            {{end}}
        </select>
        <button type="submit" {{if le (len .Lists) 1}}disabled{{end}}>Transfer</button>
    </form>

    <form id="list-delete-form" hx-delete="/groceries/lists/{{.List.GroceryList.ID}}" hx-target="main"
        hx-swap="outerHTML" class="modal-form">
        <h3>Delete list</h3>
        <div>
            <small>This will permanently delete the list and all its groceries.</small>
            <button class="delete-button" type="submit">
                <span>Delete</span>
                <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
            </button>
        </div>
    </form>
</dialog>
{{end}}
