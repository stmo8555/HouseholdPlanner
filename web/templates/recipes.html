<!DOCTYPE html>
<html lang="en">

{{template "head" .}}

<body>
    <div class="background">
        {{template "header" .}}
        <main>
            <fieldset class="margin-block-end-24px">
                <legend class="sr-only">Action buttons</legend>
                <button class="add-toggler">Add Recipe</button>
                <button class="search-toggler">Search</button>
            </fieldset>

            <section class="glass container search-section hidden">
                <h2><label for="fuzzy-search">Search</label></h2>
                <input type="text" id="fuzzy-search" class="glass-inner focus" placeholder="Type keywords...">
            </section>

            <form class="glass container add-form add-recipe-form hidden" method="post" action="/recipes/add">
                <h2>Add Recipe</h2>
                <input class="inline-size-full glass-inner focus margin-block-end-24px"
                    placeholder="Add link to recipe..." id="1" type="text" name="link" required>
                <button class="inline-size-full margin-inline-auto block" type="submit">Add</button>
            </form>

            <div class="grid-recipe">
                {{range .Data}}
                <div class="glass recipe-card" data-title="{{.Title}}">
                    <div class="image-wrapper">
                        <img src="{{.ImgURL}}" alt="{{.Title}}">
                        <a href="{{.Link}}" class="button-styling">↗</a>
                    </div>
                    <div class="title">
                        <p>{{.Title}}</p>
                        <form method="POST" action="/recipes/extract">
                            <input type="hidden" name="link" value="{{ .Link }}">
                            <button type="submit">Add To Groceries</button>
                        </form>
                    </div>
                </div>
                {{end}}
            </div>
        </main>
        {{template "footer" .}}
        <script type="module" type="module" src="/static/script.js"></script>
    </div>
</body>

</html>
