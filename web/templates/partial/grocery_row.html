{{define "grocery_row"}}
<div data-id="{{.Id}}" class="grocery-row changable {{if .Picked}}line-through{{end}}">
    <form hx-post="/groceries" hx-target=".grocery-list" hx-swap="outerHTML" hx-include="#grocery-filter-controls">
        <input type="hidden" name="id" value="{{.Id}}">
        <button type="submit">
            <div class="checkbox {{if .Picked}}checked{{end}}"></div>
            <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
        </button>
    </form>

    <span data-field="name">{{.Ingredient.Product.Name}}</span>
    <span data-field="amount">{{.Ingredient.Amount}}</span>
    <span data-field="brand">{{.Ingredient.Product.Brand}}</span>
    <button class="edit-btn" type="button">⋮</button>
</div>
{{end}}
