<!DOCTYPE html>
<html lang="en">
{{template "layouts/head" .}}

<body>
    <div class="background">
        {{template "layouts/header" .}}
        <main>
            <div class="margin-block-end-24px">
                <button class="add-toggler">Add</button>
                <button class="smart-add-toggler">Smart Add</button>
            </div>
            <form class="glass container add-form todo-form hidden" hx-post="/todos/add" hx-swap="outerhtml"
                hx-target=".todo-list" hx-on::after-request="
                            if(event.detail.successful) {
                                this.reset();
                                syncDueDateControls();
                                initRepeatControls();
                            }
                            ">
                <h2>Add Task</h2>
                <input class="glass-inner margin-block-end-12px" placeholder="Add a new task..." id="1" type="text"
                    name="task" required>
                <fieldset>
                    <legend class="block margin-block-end-12px">Due</legend>
                    <div class="flex gap-6px margin-block-end-12px">
                        <input type="radio" id="today" name="due-choices" value="today" checked="true" class="">
                        <label for="today" class="button-styling">Today</label>

                        <input type="radio" id="tomorrow" name="due-choices" value="tomorrow" class="">
                        <label for="tomorrow" class="button-styling">Tomorrow</label>

                        <input type="radio" id="unspecified" name="due-choices" value="unspecified" class="">
                        <label for="unspecified" class="button-styling">Unspecified</label>

                        <input type="radio" id="custom" name="due-choices" value="custom" class="">
                        <label for="custom" class="button-styling">Custom</label>
                    </div>
                    <input name="due" type="date" id="datepicker" class="glass-inner hidden margin-block-end-12px">
                </fieldset>

                <fieldset id="repeat-field" class="margin-block-end-24px">
                    <legend class="block margin-block-end-12px">Repeat</legend>

                    <div class="flex space-between">
                        <select id="repeat-dropdown" name="repeat" class="glass-inner">
                            <option value="never">Never</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                        <div class="repeat-frequency-container hidden">
                            <span>Every</span>
                            <button type="button" value="-1">-</button>
                            <input class="glass-inner" type="number" name="frequency" value="1" min="1" max="99">
                            <button type="button" value="1">+</button>
                            <span id="repeat-unit"></span>
                        </div>
                    </div>
                </fieldset>
                <button class="inline-size-full margin-inline-auto block" type="submit">Add</button>
            </form>


            <form class="smart-add-form container glass hidden" hx-post="/todos/smartadd" hx-target=".todo-list"
                hx-swap="outerHTML">
                <h2><label for="smart-add">Smart Add</label></h2>

                <textarea id="smart-add" class="glass-inner margin-block-end-12px"
                    placeholder='Add a task... (try: "clean window every sunday")' name="text" required></textarea>
                <button class="inline-size-full margin-inline-auto block" type="submit">Add</button>
            </form>

            <!--    filter -->
            <fieldset class="todo-filter glass">
                <legend class="sr-only">Filter todos</legend>

                <input type="radio" id="allFilter" name="filter" value="all" checked>
                <label for="allFilter">All</label>

                <input type="radio" id="todayFilter" name="filter" value="today">
                <label for="todayFilter">Today</label>

                <input type="radio" id="soonFilter" name="filter" value="soon">
                <label for="soonFilter">Soon</label>

                <input type="radio" id="overdueFilter" name="filter" value="overdue">
                <label for="overdueFilter">Overdue</label>

                <input type="radio" id="completedFilter" name="filter" value="completed">
                <label for="completedFilter">Completed</label>
            </fieldset>
            <!-- end of filter -->

            {{template "todos/list" .}}

        </main>
        <script type="module" src="/static/script.js"></script>
        <script>
            function formatDate(date) {
                return date.toISOString().split('T')[0];
            }

            function initDueDateControls() {
                const radios = document.querySelectorAll('input[name="due-choices"]');
                const datepicker = document.getElementById('datepicker');

                if (!datepicker) return;

                datepicker.value = formatDate(new Date());

                radios.forEach(radio => {
                    radio.addEventListener('change', () => {
                        const date = new Date();

                        switch (radio.value) {
                            case 'today':
                                datepicker.value = formatDate(date);
                                datepicker.classList.add("hidden");
                                break;

                            case 'tomorrow':
                                date.setDate(date.getDate() + 1);
                                datepicker.value = formatDate(date);
                                datepicker.classList.add("hidden");
                                break;

                            case 'unspecified':
                                datepicker.value = "";
                                datepicker.classList.add("hidden");
                                break;

                            case 'custom':
                                datepicker.classList.remove("hidden");
                                datepicker.focus();
                                break;

                            default:
                                throw new Error("Value not supported");
                        }
                    });
                });
            }

            repeatBtnsInitiliazed = false // This is a band aid kind of. Should make a smarter solution

            function initRepeatControls() {
                const repeatDropdown = document.getElementById("repeat-dropdown");
                const repeatIntervalContainer = document.querySelector(".repeat-frequency-container");

                if (!repeatDropdown || !repeatIntervalContainer) return;

                const repeatBtns = repeatIntervalContainer.querySelectorAll("button");
                const repeatInterval = repeatIntervalContainer.querySelector("input");

                const toggle = () => {
                    const isNever = repeatDropdown.value === 'never';
                    repeatIntervalContainer.classList.toggle("hidden", isNever);
                };

                toggle()

                repeatDropdown.addEventListener('change', () => {
                    toggle()
                });

                if (!repeatBtnsInitiliazed) {
                    repeatBtns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            if (!repeatInterval) return;

                            if (btn.value === "1") {
                                repeatInterval.stepUp();
                            } else {
                                repeatInterval.stepDown();
                            }
                        });
                    });

                    repeatBtnsInitiliazed = true
                }
            }

            let activeFilter = "all";

            function initTodoFilters() {
                const filterRadios = document.querySelectorAll('input[name="filter"]');
                const todoSections = document.querySelectorAll("[data-filter-section]");

                function applyFilter(selectedFilter) {
                    activeFilter = selectedFilter;

                    todoSections.forEach(section => {
                        const sectionFilter = section.dataset.filterSection.toLowerCase();

                        const shouldShow =
                            selectedFilter === "all" ||
                            selectedFilter === sectionFilter;

                        section.classList.toggle("hidden", !shouldShow);
                    });
                }

                filterRadios.forEach(radio => {
                    radio.checked = radio.value === activeFilter;

                    radio.onchange = () => {
                        applyFilter(radio.value);
                    };
                });

                applyFilter(activeFilter);
            }

            initDueDateControls();
            initRepeatControls();
            initTodoFilters();

            document.body.addEventListener("htmx:afterSwap", event => {
                if (event.detail.target.matches(".todo-list")) {
                    initTodoFilters();
                }
            });

            function syncDueDateControls() {
                const selected = document.querySelector('input[name="due-choices"]:checked');
                if (!selected) return;

                selected.dispatchEvent(new Event("change"));
            }
        </script>
    </div>
</body>

</html>
