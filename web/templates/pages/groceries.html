<!DOCTYPE html>
<html lang="en">

{{template "layouts/head" .}}

<body>
    <div class="background">
        {{template "layouts/header" .}}
        {{template "groceries/overview_page" .}}
        <script type="module" src="/static/script.js"></script>
        <script>
            document.body.addEventListener("click", event => {
                const button = event.target.closest(".edit-btn");
                if (!button)
                    return;

                const row = button.closest(".grocery-row");

                const id = row.dataset.id.trim();
                const name = row.querySelector('[data-field="name"]').textContent.trim();
                const amount = row.querySelector('[data-field="amount"]').textContent.trim();
                const brand = row.querySelector('[data-field="brand"]').textContent.trim();

                document.querySelectorAll(".edit-id").forEach(e => e.value = id);
                document.getElementById("edit-name").value = name;
                document.getElementById("edit-amount").value = amount;
                document.getElementById("edit-brand").value = brand;

                document.getElementById("edit-modal").showModal();
            });
        </script>
    </div>
</body>

</html>
