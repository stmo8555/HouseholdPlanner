<!DOCTYPE html>
<html lang="en">
{{template "layouts/head" .}}

<body class="flower-power">
    <div class="background">
        {{template "layouts/header" .}}
        <main>
            <form class="login-form glass card" method="POST" action="/login">
                <h2 class="login-title">Welcome back</h2>
                <p class="login-subtitle">Sign in to your household</p>

                {{if .Error}}
                <p class="login-error" role="alert">{{.Error}}</p>
                {{end}}

                <label for="uname">Username</label>
                <input class="glass-inner" type="text" id="uname" name="uname" required>

                <label for="pwd">Password</label>
                <input class="glass-inner" type="password" id="pwd" name="pwd" required>

                <button class="login-button" type="submit">Login</button>
            </form>
        </main>
        <script type="module" src="/static/script.js"></script>
        <script>
            document.querySelectorAll(".header-items").forEach(container => {
                container.querySelectorAll(":scope > *").forEach(child => {
                    if (child.tagName !== "H1") {
                        child.remove();
                    }
                });
            });
        </script>
    </div>
</body>

</html>
