<!DOCTYPE html>
<html lang="en">
{{template "layouts/head" .}}

<body class="flower-power auth-body">
    <div class="background">
        {{template "layouts/header" .}}
        <main class="auth-page">
            <form class="login-form glass card" method="POST" action="/register/{{.Token}}">
                <h2 class="login-title">Create account</h2>
                <p class="login-subtitle">Join your household on Household Planner</p>

                {{if .Error}}
                <p class="login-error" role="alert">{{.Error}}</p>
                {{end}}

                <label for="uname">Username</label>
                <input class="glass-inner" type="text" id="uname" name="uname" required autofocus
                    autocomplete="username">

                <label for="pwd">Password</label>
                <input class="glass-inner" type="password" id="pwd" name="pwd" required autocomplete="new-password">

                {{template "auth/household_choice" .}}

                <button class="login-button" type="submit">Create account</button>
            </form>
        </main>
        <script type="module" src="/static/script.js"></script>
    </div>
</body>

</html>
