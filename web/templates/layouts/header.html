{{define "layouts/header"}}
<header>
    <div class="header-items">
        <h1><a href="/">Household planner</a></h1>
        {{if not .HideNav}}
        <button id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
            <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line class="nav-line-top" x1="3" y1="6" x2="21" y2="6" />
                <line class="nav-line-mid" x1="3" y1="12" x2="21" y2="12" />
                <line class="nav-line-bottom" x1="3" y1="18" x2="21" y2="18" />
            </svg>
        </button>
        <nav id="primary-nav">
            <ul class="center-horizontal">
                <li>
                    <strong>
                        <a href="/groceries"
                            class='{{if eq .CurrentPath "/groceries"}}active mobile-nav-chosen{{end}}'>Groceries</a>
                    </strong>
                </li>
                <li>
                    <strong>
                        <a href="/settings"
                            class='{{if eq .CurrentPath "/settings"}}active mobile-nav-chosen{{end}}'>Settings</a>
                    </strong>
                </li>
                <li>
                    <strong>
                        <form method="POST" action="/logout" class="logout-form">
                            <button type="submit" class="nav-link-button">Logout</button>
                        </form>
                    </strong>
                </li>
            </ul>
        </nav>
        {{end}}
    </div>
</header>
<div class="overlay"></div>
{{end}}
