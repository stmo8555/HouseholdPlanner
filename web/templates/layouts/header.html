{{define "layouts/header"}}
<header>
    <div class="overlay"></div>
    <div class="header-items">
        <h1><a href="/">Household planner</a></h1>
        {{if not .HideNav}}
        <button id="nav-toggle" aria-label="Toggle navigation">
            <svg class="nav-icon-open" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
            <svg class="nav-icon-close" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="5" y1="5" x2="19" y2="19" />
                <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
        </button>
        <nav id="primary-nav">
            <ul class="center-horizontal">
                <li>
                    <strong>
                        <a href="/groceries"
                            class='{{if eq .CurrentPath "/groceries"}}active mobile-nav-chosen{{end}}'>Groceries</a>
                    </strong>
                </li>
                <li>
                    <strong>
                        <a href="/settings"
                            class='{{if eq .CurrentPath "/settings"}}active mobile-nav-chosen{{end}}'>Settings</a>
                    </strong>
                </li>
                <li>
                    <strong>
                        <form method="POST" action="/logout" class="logout-form">
                            <button type="submit" class="nav-link-button">Logout</button>
                        </form>
                    </strong>
                </li>
            </ul>
    </div>
    </nav>
    {{end}}
</header>
{{end}}
