{{define "layouts/head"}}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/vendor/fonts.css">

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/assets/favicon-64.png">
    <script src="/static/vendor/htmx.min.js"></script>

    <meta name="csrf-token" content="{{ .CSRFToken }}">
    <script>
        addEventListener("pagereveal", (e) => {
            if (e.viewTransition) document.documentElement.classList.add("intro-done", "vt-page");
        });
        setTimeout(() => document.documentElement.classList.add("intro-done"), 1500);
    </script>
    <script>
        document.addEventListener('htmx:configRequest', (e) => {
            e.detail.headers['X-CSRF-Token'] =
                document.querySelector('meta[name="csrf-token"]').content;
        });
    </script>
</head>
{{end}}
