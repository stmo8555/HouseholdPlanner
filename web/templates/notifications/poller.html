{{define "notifications/poller"}}
{{template "household/version_input" .}}
{{if .Changed}}
<section class="household-notification glass" role="status" aria-live="polite">
    <div>
        <strong>Household updated</strong>
        <p>Someone else made a change. Refresh to see the latest data.</p>
    </div>
    <div class="household-notification-actions">
        <button type="button" onclick="window.location.reload()">Refresh</button>
        <button type="button" class="notification-dismiss" hx-get="/notifications/ack" hx-target="#household-sync-state"
            hx-swap="innerHTML">Dismiss</button>
    </div>
</section>
{{end}}
{{end}}
