<!DOCTYPE html>
<html lang="en">

{{template "head" .}}

<body>
    <div class="background">
        {{template "header" .}}
        <main>
            <div class="margin-block-end-24px">
                <legend class="sr-only">Action buttons</legend>
                <button class="add-toggler">Add Grocery</button>
                <button class="smart-add-toggler">Smart Add</button>
                <button id="extract-button">Extract</button>
            </div>

            <form class="glass container add-form add-grocery-form hidden" hx-post="/groceries/add"
                hx-target=".grocery-list" hx-swap="outerHTML" hx-include="#grocery-filter-controls"
                hx-on::after-request="if(event.detail.successful) {this.reset(); syncDueDateControls(); initTodoFilters();}">

                <h2>Add Grocery</h2>
                <p class="margin-block-end-12px"><strong>Quick Select</strong></p>
                <div class="quick-select margin-block-end-24px">
                    {{range .TopProducts}}
                    <button type="button" class="quick-btn">{{.}}</button>
                    {{end}}
                </div>
                <ul class="margin-block-end-24px">
                    <li>
                        <label for="product-input">Product <small>(required)</small></label>
                        <input class="glass-inner focus" id="product-input" type="text" name="name" required>
                    </li>
                    <li>
                        <label for="3">Amount</label>
                        <input class="glass-inner" id="3" type="text" name="amount">
                    </li>
                    <li>
                        <label for="2">Brand</label>
                        <input class="glass-inner" id="2" type="text" name="brand">
                    </li>
                </ul>
                <button class="inline-size-full margin-inline-auto block" type="submit">
                    <span>Add</span>
                    <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
                </button>
            </form>

            <dialog class="glass container" id="edit-modal">
                <form class="flex align-items" method="dialog">
                    <h2>Edit Grocery</h2>
                    <button class="close-button" type="submit">
                        <svg fill="#FFFFFF" height="1rem" width="1rem" version="1.1" id="Capa_1"
                            xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                            viewBox="0 0 460.775 460.775" xml:space="preserve">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path
                                    d="M285.08,230.397L456.218,59.27c6.076-6.077,6.076-15.911,0-21.986L423.511,4.565c-2.913-2.911-6.866-4.55-10.992-4.55 c-4.127,0-8.08,1.639-10.993,4.55l-171.138,171.14L59.25,4.565c-2.913-2.911-6.866-4.55-10.993-4.55 c-4.126,0-8.08,1.639-10.992,4.55L4.558,37.284c-6.077,6.075-6.077,15.909,0,21.986l171.138,171.128L4.575,401.505 c-6.074,6.077-6.074,15.911,0,21.986l32.709,32.719c2.911,2.911,6.865,4.55,10.992,4.55c4.127,0,8.08-1.639,10.994-4.55 l171.117-171.12l171.118,171.12c2.913,2.911,6.866,4.55,10.993,4.55c4.128,0,8.081-1.639,10.992-4.55l32.709-32.719 c6.074-6.075,6.074-15.909,0-21.986L285.08,230.397z">
                                </path>
                            </g>
                        </svg>
                    </button>
                </form>
                <form hx-post="/groceries/edit" hx-target=".grocery-list" hx-swap="outerHTML"
                    hx-on::after-request=" if(event.detail.successful) { this.closest('dialog').close(); }"
                    hx-include="#grocery-filter-controls" class="edit-grocery-form">

                    <input type="hidden" name="id" class="edit-id">
                    <ul class="margin-block-end-24px">
                        <li>
                            <label for="edit-name">Product <small>(required)</small></label>
                            <input class="glass-inner focus" id="edit-name" name="name" required>
                        </li>
                        <li>
                            <label for="edit-amount">Amount</label>
                            <input class="glass-inner" id="edit-amount" name="amount">
                        </li>
                        <li>
                            <label for="edit-brand">Brand</label>
                            <input class="glass-inner" id="edit-brand" name="brand">
                        </li>
                    </ul>

                    <div class="flex gap-6px">
                        <button class="inline-size-full" type="submit">
                            <span>Save</span>
                            <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
                        </button>
                        <button form="delete-form" class="inline-size-full delete-button" type="submit">
                            <span>Delete</span>
                            <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
                        </button>
                    </div>
                </form>

                <form id="delete-form" hx-post="/groceries/delete" hx-target=".grocery-list" hx-swap="outerHTML"
                    hx-on::after-request=" if(event.detail.successful) { this.closest('dialog').close(); }"
                    hx-include="#grocery-filter-controls">

                    <input type="hidden" name="id" class="edit-id">
                </form>

            </dialog>

            <form class="smart-add-form glass container hidden" hx-post="/groceries/smartadd" hx-target="main"
                hx-swap="outerHTML">
                <h2><label for="smart-add">Smart Add</label></h2>

                <textarea id="smart-add" class="glass-inner margin-block-end-24px"
                    placeholder='Add groceries... (try: "10 bananas, 5L Arla milk"' name="text"
                    required></textarea>
                <button class="inline-size-full margin-inline-auto block" type="submit">
                    <span>Add</span>
                    <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
                </button>
            </form>

            <form class="extract-grocery-form glass container hidden" hx-post="/groceries/extract" hx-target="main"
                hx-swap="outerHTML">
                <h2>Extract Ingredients From Recipe</h2>
                <input class="inline-size-full glass-inner focus margin-block-end-24px"
                    placeholder="Add link to recipe..." type="text" name="link" required>
                <button class="inline-size-full margin-inline-auto block" type="submit">
                    <span>Add</span>
                    <img class="htmx-indicator" src="/static/assets/spinner.gif" alt="Loading...">
                </button>
            </form>

            {{template "grocery_list" .}}
        </main>
        <script type="module" src="/static/script.js"></script>
        <script>
            document.body.addEventListener("click", event => {
                const button = event.target.closest(".edit-btn");
                if (!button)
                    return;

                const row = button.closest(".grocery-row");

                const id = row.dataset.id.trim();
                const name = row.querySelector('[data-field="name"]').textContent.trim();
                const amount = row.querySelector('[data-field="amount"]').textContent.trim();
                const brand = row.querySelector('[data-field="brand"]').textContent.trim();

                document.querySelectorAll(".edit-id").forEach(e => e.value = id);
                document.getElementById("edit-name").value = name;
                document.getElementById("edit-amount").value = amount;
                document.getElementById("edit-brand").value = brand;

                document.getElementById("edit-modal").showModal();
            });
        </script>
    </div>
</body>

</html>
