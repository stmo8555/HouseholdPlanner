<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Offline mode</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/vendor/fonts.css">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/assets/favicon-64.png">
</head>

<body>
    <div class="background">
        <header>
            <div class="offline-banner">
                <span>Offline mode<span id="offline-queue-label" hidden> · <span
                            id="offline-queue-count">0</span> unsynced</span></span>
                <button type="button" id="offline-exit-btn">Go online &amp; sync</button>
            </div>
        </header>

        <main id="offline-main">
            <section class="glass container grocery-list empty-state" id="offline-empty" hidden>
                <h3>Nothing here yet</h3>
                <p>Open a grocery list and press <strong>Shop offline</strong> to use it without internet.</p>
                <a href="/groceries" class="button-styling">Go to your grocery lists</a>
            </section>
        </main>
    </div>

    <script type="module" src="/static/offline-view.js"></script>
</body>

</html>
