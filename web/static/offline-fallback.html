<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Household Planner</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0F172A;
            color: #E2E8F0;
            font-family: Roboto, system-ui, sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        button {
            font: inherit;
            font-weight: 700;
            color: #0F172A;
            background: #7DD3FC;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 2px solid #E2E8F0;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <main>
        <h1>You're offline</h1>
        <p>This page needs a connection. It'll load as soon as you're back online.</p>
        <p><button type="button" onclick="location.reload()">Try again</button></p>
    </main>
    <script>
        addEventListener("online", () => location.reload());
    </script>
</body>

</html>
