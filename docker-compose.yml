name: household-planner

services:
  app:
    build: .
    restart: unless-stopped
    # .env holds shared credentials (also used by local `go run .`).
    # environment: overrides the values that only apply inside Docker.
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db        # the `db` service name resolves on the Compose network
      - POSTGRES_PORT=5432
      - GIN_MODE=release
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql
      - ./household-db/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
